```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Anima Central</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .logo { width: 80px; height: 80px; border: 1px solid #0f0; border-radius: 50%; margin-bottom: 10px; }
        button { width: 100%; max-width: 320px; padding: 18px; margin: 8px 0; background: #111; border: 1px solid #333; color: #0f0; cursor: pointer; text-transform: uppercase; font-weight: bold; }
        #estado { margin-top: 20px; padding: 15px; border: 1px dashed #333; width: 100%; max-width: 300px; text-align: center; font-size: 13px; color: #aaa; }
        img { width: 100%; max-width: 320px; margin-top: 20px; border: 1px solid #0f0; }
    </style>
</head>
<body>
    <img src="https://cdn-icons-png.flaticon.com/512/2857/2857535.png" class="logo">
    <h2>NEXUS ANIMA CENTRAL</h2>
    
    <button onclick="ejecutar('video')">🎬 Generar Video/Imagen</button>
    <button onclick="ejecutar('musica')">🎵 Generar Música</button>
    <button onclick="ejecutar('investigacion')">🔍 Investigar</button>
    <button onclick="ejecutar('proyectos')">🛠️ Proyectos</button>
    
    <div id="estado">Estado: Sistema listo</div>

    <script>
        function obtenerLlave() {
            let token = localStorage.getItem('NEXUS_TOKEN');
            if (!token) {
                token = prompt("🔐 Ingresa tu llave (hf_...):");
                if (token) localStorage.setItem('NEXUS_TOKEN', token);
            }
            return token;
        }

        async function ejecutar(modulo) {
            const token = obtenerLlave();
            if (!token) return;
            const estado = document.getElementById('estado');
            estado.innerText = "Estado: Procesando " + modulo + "...";

            if (modulo === 'video') {
                try {
                    const response = await fetch("https://api-inference.huggingface.co/models/stabilityai/stable-diffusion-xl-base-1.0", {
                        method: "POST",
                        headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
                        body: JSON.stringify({ inputs: "Cinematic shot of a roman centurion in a futuristic brutalist wasteland, 8k, hyper-detailed" })
                    });
                    const blob = await response.blob();
                    const url = URL.createObjectURL(blob);
                    const img = document.createElement('img');
                    img.src = url;
                    document.body.appendChild(img);
                    estado.innerText = "Estado: Creación finalizada.";
                } catch (e) {
                    estado.innerText = "Estado: Error en la generación.";
                }
            } else {
                estado.innerText = "Estado: Módulo " + modulo + " en línea.";
            }
        }
    </script>
</body>
</html>
