<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexo Anima Core v2.0</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: rgba(18, 18, 18, 0.85);
            --accent: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.3);
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
        }
        body { 
            background: var(--bg-color); 
            color: var(--text-main); 
            font-family: system-ui, -apple-system, sans-serif; 
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 { 
            color: var(--accent); 
            font-size: 2rem;
            margin: 0 0 10px 0;
            text-shadow: 0 0 15px var(--accent-glow);
        }
        .status-badge {
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: inline-block;
        }
        .container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        .module-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        textarea, input {
            width: 100%;
            background: #111;
            border: 1px solid #333;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            margin-bottom: 10px;
            resize: none;
        }
        textarea:focus, input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
        }
        button { 
            background: var(--accent); 
            color: #000; 
            border: none; 
            padding: 12px 20px; 
            font-size: 0.95rem; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }
        button:active { 
            transform: scale(0.98); 
            box-shadow: 0 0 12px var(--accent);
        }
        .output-box {
            margin-top: 10px;
            background: #0a0a0a;
            border-left: 3px solid var(--accent);
            padding: 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-radius: 4px;
            display: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>Nexo Anima</h1>
        <div class="status-badge">Núcleo Inteligente Activo</div>
    </header>
    
    <div class="container">
        <!-- Módulo de Video -->
        <div class="card">
            <div class="module-title">🎬 Motor de Video Cinematográfico</div>
            <textarea id="videoPrompt" rows="2" placeholder="Describe la escena, guion o efectos..."></textarea>
            <button onclick="processModule('video')">Generar Secuencia</button>
            <div id="videoOutput" class="output-box"></div>
        </div>

        <!-- Módulo de Imágenes -->
        <div class="card">
            <div class="module-title">🖼️ Síntesis Visual y Arte</div>
            <textarea id="imagePrompt" rows="2" placeholder="Describe el concepto visual, estilo o mapa..."></textarea>
            <button onclick="processModule('image')">Sintetizar Imagen</button>
            <div id="imageOutput" class="output-box"></div>
        </div>

        <!-- Módulo de Música -->
        <div class="card">
            <div class="module-title">🎵 Composición Musical y Estilos</div>
            <textarea id="musicPrompt" rows="2" placeholder="Define género, letras, ritmo o mambo urbano..."></textarea>
            <button onclick="processModule('music')">Componer Pista</button>
            <div id="musicOutput" class="output-box"></div>
        </div>
    </div>

    <script>
        function processModule(type) {
            const prompts = {
                video: { input: document.getElementById('videoPrompt'), output: document.getElementById('videoOutput'), msg: '🎬 Secuencia de video analizada y estructurada con éxito.' },
                image: { input: document.getElementById('imagePrompt'), output: document.getElementById('imageOutput'), msg: '🖼️ Parámetros de diseño visual procesados y listos.' },
                music: { input: document.getElementById('musicPrompt'), output: document.getElementById('musicOutput'), msg: '🎵 Estructura rítmica y armónica generada correctamente.' }
            };

            const mod = prompts[type];
            if (!mod.input.value.trim()) {
                mod.output.style.display = 'block';
                mod.output.innerText = '⚠️ Por favor, ingresa los parámetros o la idea inicial.';
                return;
            }

            mod.output.style.display = 'block';
            mod.output.innerText = '⏳ Procesando evolución inteligente...';
            
            setTimeout(() => {
                mod.output.innerText = mod.msg + ' Contenido listo para producción.';
            }, 1000);
        }
    </script>
</body>
</html>
