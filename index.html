<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS | ANIMA CENTRAL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #00f2ff;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #app-container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            margin: 20px 0;
            font-size: 1.5em;
            text-shadow: 0 0 10px #00f2ff;
        }

        .logo {
            width: 100px;
            height: 100px;
            border: 2px solid #00f2ff;
            border-radius: 50%;
            box-shadow: 0 0 20px #00f2ff;
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.1);
        }

        button {
            width: 100%;
            padding: 15px 20px;
            margin: 10px 0;
            background: #050505;
            border: 1px solid #00f2ff;
            color: #00f2ff;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #00f2ff;
            color: #000;
            box-shadow: 0 0 15px #00f2ff;
        }

        button:active {
            transform: scale(0.98);
        }

        #console {
            width: 100%;
            height: 150px;
            background: #000;
            color: #0f0;
            padding: 10px;
            border-radius: 10px;
            font-family: monospace;
            overflow-y: auto;
            border: 1px solid #333;
            margin-top: 20px;
            font-size: 0.85em;
            line-height: 1.4;
            text-align: left;
        }

        #console::-webkit-scrollbar {
            width: 6px;
        }

        #console::-webkit-scrollbar-track {
            background: #111;
            border-radius: 10px;
        }

        #console::-webkit-scrollbar-thumb {
            background: #00f2ff;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <img src="https://cdn-icons-png.flaticon.com/512/2857/2857535.png" class="logo" alt="Nexus Logo">
        <h2>NEXUS ANIMA CENTRAL</h2>
        <button onclick="nucleo.activar('MUSICA')">🎵 MÚSICA</button>
        <button onclick="nucleo.activar('VIDEO')">🎬 VIDEO</button>
        <button onclick="nucleo.activar('INVESTIGAR')">🔍 INVESTIGAR</button>
        <button onclick="nucleo.activar('PROYECTOS')">🛠️ PROYECTOS</button>
        <div id="console">NEXUS CORE: Sistema autónomo inicializado.</div>
    </div>

    <script>
        const nucleo = {
            log: function(msg) {
                const c = document.getElementById('console');
                const timestamp = new Date().toLocaleTimeString();
                c.innerHTML += `<br>[${timestamp}] > ${msg}`;
                c.scrollTop = c.scrollHeight;
            },
            activar: function(tarea) {
                this.log(`Protocolo ${tarea} ejecutado por el Creador.`);
            }
        };

        window.addEventListener('load', () => {
            nucleo.log('Bienvenido, Creador. Identidad confirmada.');
        });
    </script>
</body>
</html>
