<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Anima Central</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .logo { width: 80px; height: 80px; border: 1px solid #0f0; border-radius: 50%; margin-bottom: 10px; }
        button { width: 100%; max-width: 300px; padding: 15px; margin: 8px 0; background: #111; border: 1px solid #333; color: #0f0; cursor: pointer; text-transform: uppercase; }
        #estado { margin-top: 20px; font-size: 12px; color: #666; text-align: center; }
    </style>
</head>
<body>
    <img src="https://cdn-icons-png.flaticon.com/512/2857/2857535.png" class="logo" alt="Nexus">
    <h2>NEXUS ANIMA CENTRAL</h2>
    
    <button onclick="ejecutar('musica')">🎵 Generar Música</button>
    <button onclick="ejecutar('video')">🎬 Generar Video</button>
    <button onclick="ejecutar('investigacion')">🔍 Investigar</button>
    <button onclick="ejecutar('proyectos')">🛠️ Proyectos</button>
    
    <div id="estado">Estado: Sistema en línea</div>

    <script>
        function obtenerLlave() {
            let token = localStorage.getItem('NEXUS_TOKEN');
            if (!token) {
                token = prompt("🔐 Ingresa tu llave de seguridad:");
                if (token) localStorage.setItem('NEXUS_TOKEN', token);
            }
            return token;
        }

        function ejecutar(modulo) {
            const token = obtenerLlave();
            if (!token) return;
            document.getElementById('estado').innerText = "Estado: Iniciando " + modulo + "...";
        }
    </script>
</body>
</html>
