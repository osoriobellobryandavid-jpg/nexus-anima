<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS | CORE</title>
    <style>
        body { background: #050505; color: #00f2ff; font-family: 'Courier New', monospace; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        #app-container { width: 100%; max-width: 400px; }
        .logo { width: 80px; height: 80px; border: 2px solid #00f2ff; border-radius: 50%; display: block; margin: 0 auto 15px; box-shadow: 0 0 15px #00f2ff; }
        button { width: 100%; padding: 15px; margin: 6px 0; background: #0a0a0a; border: 1px solid #333; color: #00f2ff; cursor: pointer; text-transform: uppercase; font-weight: bold; border-radius: 5px; }
        #console { width: 100%; height: 250px; background: #000; color: #0f0; padding: 10px; border: 1px solid #333; margin-top: 15px; font-size: 13px; overflow-y: auto; white-space: pre-wrap; box-sizing: border-box; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="app-container">
        <img src="https://cdn-icons-png.flaticon.com/512/2857/2857535.png" class="logo" alt="Nexus">
        <h2 style="text-align:center; margin-top:0;">NEXUS ANIMA CENTRAL</h2>
        <button onclick="ejecutar('MUSICA')">🎵 MÚSICA</button>
        <button onclick="ejecutar('VIDEO')">🎬 VIDEO</button>
        <button onclick="ejecutar('INVESTIGAR')">🔍 INVESTIGAR</button>
        <button onclick="ejecutar('PROYECTOS')">🛠️ PROYECTOS</button>
        <div id="console">NEXUS CORE: Esperando instrucción...</div>
    </div>
    <script>
        const c = document.getElementById('console');
        async function ejecutar(tarea) {
            const token = localStorage.getItem('NEXUS_TOKEN') || prompt("🔐 Ingresa tu llave (hf_...):");
            if (!token) return;
            localStorage.setItem('NEXUS_TOKEN', token);
            c.innerHTML += `\n\n> Protocolo ${tarea} iniciado.`;
            if (tarea === 'INVESTIGAR') {
                const query = prompt("¿Qué deseas investigar?");
                if (!query) return;
                c.innerHTML += `\n> Analizando: ${query}...`;
                try {
                    const res = await fetch("https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.2", {
                        method: "POST",
                        headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
                        body: JSON.stringify({ inputs: "Responde brevemente: " + query })
                    });
                    const data = await res.json();
                    const text = data[0].generated_text.split('[/INST]')[1] || data[0].generated_text;
                    c.innerHTML += `\n> RESULTADO: ${text}`;
                } catch (e) { c.innerHTML += `\n> ERROR: Fallo de conexión.`; }
            } else {
                c.innerHTML += `\n> Módulo ${tarea} en fase de despliegue.`;
            }
            c.scrollTop = c.scrollHeight;
        }
    </script>
</body>
</html>
