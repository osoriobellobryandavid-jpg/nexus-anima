<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>NEXUS ANIMA</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { background: #050505; color: #00f2ff; font-family: 'Inter', sans-serif; margin: 0; padding: 20px; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #app-container { display: none; width: 100%; max-width: 400px; text-align: center; }
        .logo { width: 100px; height: 100px; border: 2px solid #00f2ff; border-radius: 50%; box-shadow: 0 0 20px #00f2ff; margin-bottom: 20px; }
        button { width: 100%; padding: 20px; margin: 10px 0; background: rgba(0, 242, 255, 0.1); border: 1px solid #00f2ff; color: #00f2ff; border-radius: 10px; cursor: pointer; text-transform: uppercase; font-weight: bold; }
        #console { width: 100%; height: 100px; background: #000; color: #0f0; padding: 10px; border-radius: 10px; font-family: monospace; overflow-y: auto; border: 1px solid #333; margin-top: 20px; font-size: 12px; text-align: left; }
    </style>
</head>
<body>

    <div id="app-container">
        <img src="https://cdn-icons-png.flaticon.com/512/2857/2857535.png" class="logo" alt="Nexus">
        <h2>NEXUS ANIMA CENTRAL</h2>
        <button onclick="ejecutar('MUSICA')">🎵 MÚSICA</button>
        <button onclick="ejecutar('VIDEO')">🎬 VIDEO</button>
        <button onclick="ejecutar('INVESTIGAR')">🔍 INVESTIGAR</button>
        <button onclick="ejecutar('PROYECTOS')">🛠️ PROYECTOS</button>
        <div id="console">NEXUS CORE: Sistema en línea...</div>
    </div>

    <script>
        const DISPOSITIVO_AUTORIZADO = btoa(navigator.userAgent); 
        
        function iniciar() {
            let id = localStorage.getItem('NEXUS_ID');
            if (!id) {
                localStorage.setItem('NEXUS_ID', DISPOSITIVO_AUTORIZADO);
                id = DISPOSITIVO_AUTORIZADO;
            }
            
            if (id === DISPOSITIVO_AUTORIZADO) {
                document.getElementById('app-container').style.display = 'block';
            } else {
                document.body.innerHTML = "<h1 style='color:red'>ACCESO DENEGADO</h1>";
            }
        }

        async function ejecutar(tarea) {
            const c = document.getElementById('console');
            c.innerHTML += `<br>> Protocolo ${tarea} iniciado.`;
            c.scrollTop = c.scrollHeight;
            alert("Verificando identidad biométrica para: " + tarea);
        }

        iniciar();
    </script>
</body>
</html>
