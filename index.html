<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nexus Anima Central</title>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .logo { width: 80px; height: 80px; border: 1px solid #0f0; border-radius: 50%; margin-bottom: 10px; }
        button { width: 100%; max-width: 320px; padding: 18px; margin: 8px 0; background: #111; border: 1px solid #333; color: #0f0; cursor: pointer; text-transform: uppercase; font-weight: bold; }
        #estado { margin-top: 20px; padding: 15px; border: 1px dashed #333; width: 100%; max-width: 300px; text-align: center; font-size: 13px; color: #aaa; }
    </style>
</head>
<body>
    <img src="https://cdn-icons-png.flaticon.com/512/2857/2857535.png" class="logo">
    <h2>NEXUS ANIMA CENTRAL</h2>
    <button onclick="ejecutar('video')">🎬 GENERAR VIDEO/IMAGEN</button>
    <button onclick="ejecutar('musica')">🎵 GENERAR MÚSICA</button>
    <button onclick="ejecutar('investigacion')">🔍 INVESTIGAR</button>
    <button onclick="ejecutar('proyectos')">🛠️ PROYECTOS</button>
    <div id="estado">Estado: Sistema listo</div>
    <script>
        function ejecutar(moduulo) {
            let token = localStorage.getItem('NEXUS_TOKEN');
            if (!token) {
                token = prompt("🔐 Ingresa tu llave (hf_...):");
                if (token) localStorage.setItem('NEXUS_TOKEN', token);
                else return;
            }
            document.getElementById('estado').innerText = "Estado: Conectando...";
            // Aquí el sistema ya tiene la llave para trabajar
        }
    </script>
</body>
</html>
