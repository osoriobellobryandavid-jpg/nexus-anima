<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS | ANIMA CENTRAL</title>
    <style>
        body { background: #000; color: #00f2ff; font-family: 'Courier New', monospace; margin: 0; padding: 20px; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #app-container { width: 100%; max-width: 400px; text-align: center; }
        .logo { width: 100px; height: 100px; border: 2px solid #00f2ff; border-radius: 50%; box-shadow: 0 0 20px #00f2ff; margin-bottom: 20px; }
        button { width: 100%; padding: 20px; margin: 10px 0; background: #050505; border: 1px solid #00f2ff; color: #00f2ff; border-radius: 10px; cursor: pointer; text-transform: uppercase; font-weight: bold; }
        #console { width: 100%; height: 120px; background: #000; color: #0f0; padding: 10px; border-radius: 10px; font-family: monospace; overflow-y: auto; border: 1px solid #333; margin-top: 20px; font-size: 12px; text-align: left; }
    </style>
</head>
<body>

    <div id="app-container">
        <img src="https://cdn-icons-png.flaticon.com/512/2857/2857535.png" class="logo" alt="Nexus">
        <h2>NEXUS ANIMA CENTRAL</h2>
        <button onclick="nucleo.activar('MUSICA')">🎵 MÚSICA</button>
        <button onclick="nucleo.activar('VIDEO')">🎬 VIDEO</button>
        <button onclick="ejecutar('INVESTIGAR')">🔍 INVESTIGAR</button>
        <button onclick="ejecutar('PROYECTOS')">🛠️ PROYECTOS</button>
        <div id="console">NEXUS CORE: Sistema autónomo inicializado.</div>
    </div>

    <script>
        const nucleo = {
            log: (msg) => {
                const c = document.getElementById('console');
                c.innerHTML += `<br>> [NÚCLEO]: ${msg}`;
                c.scrollTop = c.scrollHeight;
            },
            activar: function(tarea) {
                this.log(`Protocolo ${tarea} ejecutado por el Creador.`);
            }
        };

        function ejecutar(tarea) {
            nucleo.activar(tarea);
        }

        window.onload = () => {
            nucleo.log("Bienvenido, Creador. Identidad confirmada.");
        };
    </script>
</body>
</html>
